# --- Prefix ---
# Change prefix from C-b to C-s (C-b conflicts with Emacs backward-char)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# --- Helper scripts ---
# Resolve the directory this config actually lives in (following the
# ~/.tmux.conf symlink) so the helper scripts beside it are found no matter
# where the dotfiles repo is cloned. Avoids needing a second ~/.tmux symlink.
run-shell 'tmux set -g @scripts "$(dirname "$(readlink -f ~/.tmux.conf)")"'

# --- Panes ---
# Split: prefix + | (vertical), prefix + - (horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Equalize pane sizes without rearranging: prefix + =
bind = select-layout -E

# Resize panes: prefix + H/J/K/L (5 cells/lines per press, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Windows ---
# New window keeps current directory
bind c new-window -c "#{pane_current_path}"

# Move window left/right: prefix + < / >
bind < swap-window -t -1 \; previous-window
bind > swap-window -t +1 \; next-window

# Claim the lowest unused window index (fill the leftmost gap below current).
bind . run-shell '#{@scripts}/claim-lowest-index.sh'

# Insert current window at index N (prefix + m, then 1-9)
bind m switch-client -T insert-window
bind -T insert-window 1 run-shell "#{@scripts}/insert-window.sh 1"
bind -T insert-window 2 run-shell "#{@scripts}/insert-window.sh 2"
bind -T insert-window 3 run-shell "#{@scripts}/insert-window.sh 3"
bind -T insert-window 4 run-shell "#{@scripts}/insert-window.sh 4"
bind -T insert-window 5 run-shell "#{@scripts}/insert-window.sh 5"
bind -T insert-window 6 run-shell "#{@scripts}/insert-window.sh 6"
bind -T insert-window 7 run-shell "#{@scripts}/insert-window.sh 7"
bind -T insert-window 8 run-shell "#{@scripts}/insert-window.sh 8"
bind -T insert-window 9 run-shell "#{@scripts}/insert-window.sh 9"

# Start window numbering at 1 (easier to reach than 0)
set -g base-index 1
setw -g pane-base-index 1

# --- Dashboard workflow ---
# Pull a pane from another window into the current one (tree picker).
# G splits side-by-side (join-pane -h), V splits stacked (join-pane -v).
bind G choose-tree -Zw "join-pane -h -s '%%'"
bind V choose-tree -Zw "join-pane -v -s '%%'"

# Push current pane into a window of your choice (tree picker).
# Stash the source pane id first so the join-pane template still refers to
# the originating pane after the chooser changes focus. Stays put.
bind b set -g @push-pane "#{pane_id}" \; \
  choose-tree -Zw "join-pane -d -s '#{@push-pane}' -t '%%'"

# Push current pane to an "aside" parking window. From a normal window, target
# is `aside`. From `aside` itself, target is `aside-2`; from `aside-N`, target
# is `aside-(N+1)` — so you can fan a themed cluster out of the staging window
# and rename the original. Joins the target if it exists, creates it otherwise.
bind B run-shell '#{@scripts}/push-to-aside.sh "#{pane_id}" "#{window_name}"'

# Shuffle within the current window: flash pane numbers, press digit to swap
bind "{" display-panes -d 0 "swap-pane -s '%%'"

# Insert current pane before/after chosen pane (side-by-side)
bind "(" display-panes -d 0 "join-pane -h -b -t '%%'"
bind ")" display-panes -d 0 "join-pane -h -t '%%'"

# Cross-window pane swap via tree picker (rarer)
bind S choose-tree -Zw "swap-pane -s '%%'"

# --- General ---
# Enable mouse (scroll, click to select pane, resize)
set -g mouse on

# Don't exit copy mode when finishing a mouse drag-selection IF the user was
# already in copy mode before the drag. If the drag itself triggered copy mode
# (default MouseDrag1Pane behavior outside copy mode), preserve the original
# copy-and-cancel so a regular mouse selection doesn't strand you in copy mode.
set -g @mouse-drag-entered 0
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { set -g @mouse-drag-entered 1 ; copy-mode -M }
bind -T copy-mode    MouseDragEnd1Pane if-shell -F "#{@mouse-drag-entered}" { set -g @mouse-drag-entered 0 ; send -X copy-pipe-and-cancel "pbcopy" } { send -X copy-pipe-no-clear "pbcopy" }
bind -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{@mouse-drag-entered}" { set -g @mouse-drag-entered 0 ; send -X copy-pipe-and-cancel "pbcopy" } { send -X copy-pipe-no-clear "pbcopy" }

# More scrollback
set -g history-limit 10000

# Reduce escape delay (important for Emacs)
set -sg escape-time 10

# Show pane numbers longer (prefix + q, then press number)
set -g display-panes-time 5000

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# OSC 8 hyperlink passthrough — lets clickable links (e.g. from Claude Code)
# reach the outer terminal. Requires tmux 3.4+ and a terminal that supports
# OSC 8 (WezTerm, iTerm2, Kitty, Ghostty — not Apple Terminal.app).
set -as terminal-features ',*:hyperlinks'

# Forward OSC 52 clipboard escapes to the terminal so emacs/tmux copies
# reach the system clipboard. Requires terminal support (WezTerm: yes).
set -g set-clipboard on

# Allow DCS passthrough so clipetty's tmux-wrapped OSC 52 (\ePtmux;\e]52;...\a\e\\)
# reaches the outer terminal. Off by default in tmux 3.3+.
set -g allow-passthrough on

# --- Pane styling ---
# Dim inactive panes, normal background for active.
# Note: emacs paints its own bg for every cell, so window-style is invisible
# inside emacs panes — the loud active border below is what makes focus obvious.
set -g window-style 'bg=colour237'
set -g window-active-style 'bg=colour0'

# Loud active pane border so focus is obvious even when the pane content
# (e.g. emacs) overpaints window-style.
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour34,bold'

# --- Status bar ---
# Clean, minimal status bar
set -g status-style "bg=colour238,fg=white"
set -g status-left "[#S] "
set -g status-right ""
setw -g window-status-current-format "#{?window_zoomed_flag,🔍 ,}#I:#W"
setw -g window-status-current-style "#{?window_zoomed_flag,fg=yellow bold,fg=green bold}"
setw -g window-status-style "fg=grey"
